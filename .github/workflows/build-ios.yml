name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

jobs:
  ios:
    name: iOS Build (IPA)
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
    steps:
      - uses: actions/checkout@v4

      - name: 对齐版本号
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          node -e "const fs=require('fs');for(const p of ['src-tauri/tauri.conf.json','package.json']){const j=JSON.parse(fs.readFileSync(p));j.version=process.argv[1];fs.writeFileSync(p,JSON.stringify(j,null,2)+'\n')}" "$V"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ios-build

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 初始化 iOS Xcode 工程
        run: |
          pnpm tauri ios init --ci || pnpm tauri ios init
        env:
          APPLE_DEVELOPMENT_TEAM: "ABCDE12345"

      - name: 构建 iOS 应用与打包 IPA
        shell: bash
        env:
          APPLE_DEVELOPMENT_TEAM: "ABCDE12345"
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          
          # 构建 release 模式的无证书 IPA / APP
          pnpm tauri ios build --no-signing --target aarch64-apple-ios || pnpm tauri ios build --no-signing || true
          
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -n 1)
          fi
          
          if [ -z "$APP_PATH" ]; then
            echo "尝试直接调用 xcodebuild 归档构建"
            PROJECT_PATH=$(find src-tauri/gen/apple -name "*.xcodeproj" | head -n 1)
            SCHEME_NAME=$(xcodebuild -list -project "$PROJECT_PATH" 2>/dev/null | awk '/Schemes:/{flag=1;next} flag && NF{print $1;exit}')
            echo "项目: $PROJECT_PATH, Scheme: $SCHEME_NAME"
            xcodebuild build \
              -project "$PROJECT_PATH" \
              -scheme "$SCHEME_NAME" \
              -configuration Release \
              -destination "generic/platform=iOS" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              -derivedDataPath build_output
            APP_PATH=$(find build_output -name "*.app" -type d | head -n 1)
          fi

          if [ -n "$APP_PATH" ]; then
            echo "打包 APP: $APP_PATH 为 IPA"
            mkdir -p Payload
            cp -r "$APP_PATH" Payload/
            zip -qr "artifacts/HGhub_${V}_ios.ipa" Payload
            rm -rf Payload
          else
            echo "::error::未能生成 iOS .app 文件"
            exit 1
          fi

          ls -lh artifacts/

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: HGhub-iOS-IPA
          path: artifacts/*
          if-no-files-found: error

      - name: 发布 iOS GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="${{ steps.ver.outputs.version }}"
          TAG="v${V}-ios"
          gh release create "$TAG" artifacts/*.ipa \
            --title "HGhub v${V} iOS 版" \
            --notes "### HGhub iOS 移动端安装包 (IPA)
          
本安装包为 HGhub v${V} 的 iOS 客户端打包产物（.ipa），专为 iPhone / iPad 用户提供。

#### 安装方式说明：
1. **TrollStore（巨魔商店，推荐）**：支持系统版本范围内的设备，直接打开 IPA 导入即可免签永久运行；
2. **AltStore / Sideloadly**：连接电脑使用个人免费 Apple ID 自签名安装（7天刷新）；
3. **第三方证书签名**：支持使用牛蛙助手、全能签、轻松签或个人/企业开发者证书签名安装。" \
            --prerelease || gh release upload "$TAG" artifacts/*.ipa --clobber
